<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 120 }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with slice (resources.Get "css/site.css") (resources.Get "css/chroma.css") | resources.Concat "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}">
  {{ end }}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap">© {{ site.Copyright }}</div>
  </footer>
</body>
</html>
